<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Public Share</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <nav class="navbar">
        <div class="nav-left">
            <h2 class="logo">Public Share</h2>
        </div>
        
        <div class="nav-center">
            <div class="search-box">
                <i class="fa fa-search"></i>
                <input type="text" id="friendSearch" placeholder="Search friends ID...">
            </div>
        </div>

        <div class="nav-right">
            <button class="nav-icon jump" title="Home"><i class="fa fa-home"></i></button>
            
            <label for="file-upload" class="nav-icon jump" title="Upload Media">
                <i class="fa fa-plus-square"></i>
            </label>
            <input type="file" id="file-upload" accept="image/,video/" style="display:none;">

            <div class="menu-container">
                <button class="nav-icon jump" id="menuToggle"><i class="fa fa-bars"></i></button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html"><i class="fa fa-user"></i> My Profile</a>

                    <a href="#" id="aboutBtn"><i class="fa fa-info-circle"></i> About Us</a>
                    <a href="#" id="contactBtn"><i class="fa fa-envelope"></i> Contact Us</a>
                    <a href="#" id="settingsBtn"><i class="fa fa-cog"></i> Settings</a>
                    <hr>
                    <a href="#" id="logoutBtn" style="color: #ff4d4d;"><i class="fa fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div id="infoModal" class="modal">
        <div class="modal-content glass">
            <span class="close-modal">&times;</span>
            <div id="modalText"></div>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
