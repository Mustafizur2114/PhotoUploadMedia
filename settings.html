<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Settings</title>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .settings-card { background: #1a1a1a; padding: 30px; border-radius: 12px; width: 350px; text-align: center; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #000; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-save { background: #3b82f6; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-save:hover { background: #2563eb; }
        a { color: #3b82f6; text-decoration: none; display: block; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="settings-card">
        <h2>Settings</h2>
        <label for="username-input">Change Username</label>
        <input type="text" id="username-input" placeholder="New username">
        <button id="save-btn" class="btn-save">Save Changes</button>
        <a href="profile.html">Return to Profile</a>
        <a href="#" id="deleteAccountBtn" style="color: #ff9800; margin-top: 30px; border-top: 1px solid #444; padding-top: 15px;"><i class="fa fa-trash"></i> Delete Account</a>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script type="module" src="settings.js"></script>
</body>
</html>
