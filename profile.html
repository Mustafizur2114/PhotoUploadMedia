<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Public Share</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <nav class="navbar">
        <div class="nav-left">
            <h2 class="logo" onclick="window.location.href='dashboard.html'" style="cursor:pointer;">Public Share</h2>
        </div>
        <div class="nav-right">
            <button class="nav-icon jump" onclick="window.location.href='dashboard.html'"><i class="fa fa-home"></i></button>
            <div class="menu-container">
                <button class="nav-icon jump" id="menuToggle"><i class="fa fa-bars"></i></button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html"><i class="fa fa-user"></i> My Profile</a>
                    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
                    <hr>
                    <a href="#" id="deleteAccountBtn" style="color: #ff9800;"><i class="fa fa-trash"></i> Delete Account</a>
                    <a href="index.html" style="color: #ff4d4d;"><i class="fa fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="profile-header">
        <div class="profile-info">
            <div class="profile-pic">
                <i class="fa fa-user-circle"></i>
            </div>
            <div class="profile-details">
                <h1 id="displayUsername">Loading...</h1>
                <p id="userEmailDisplay">email@example.com</p>
                <button class="edit-btn jump" onclick="window.location.href='settings.html'">Edit Profile</button>
            </div>
        </div>
    </section>

    <hr class="profile-divider">

    <main class="gallery-container">
        <h3><i class="fa fa-th"></i> My Gallery</h3>
        <div id="userGallery" class="gallery-grid">
            <p class="empty-msg">You haven't uploaded any photos yet.</p>
        </div>
    </main>

    <!-- Photo Modal -->
    <div id="photoModal" class="photo-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePhotoModal()">&times;</span>
            <img id="modalImage" src="" alt="Full Photo">
        </div>
    </div>

    <script type="module" src="profile.js"></script>
</body>
</html>
